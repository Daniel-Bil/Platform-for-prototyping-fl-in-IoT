---
# Starts one FL server on `main` and a caller-selected number of clients.
# Clients are selected in inventory order from hosts that have fl_dataset_name.
#
# Example:
#   ansible-playbook -i ansible/inventory.yml \
#     ansible/playbooks/02-start-one-client.yml \
#     -e fl_client_count=3
#
# With the current inventory this selects device-1, device-2, device-3.
# device-8 is ignored until it receives fl_dataset_name.

- name: Select FL clients for this experiment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    requested_client_count: "{{ fl_client_count | default(0) | int }}"
  tasks:
    - name: Build list of clients that have datasets assigned
      ansible.builtin.set_fact:
        eligible_fl_clients: "{{ (eligible_fl_clients | default([])) + [item] }}"
      loop: "{{ groups['fl_clients'] | default([]) }}"
      when:
        - hostvars[item].fl_dataset_name is defined
        - hostvars[item].fl_dataset_name | string | length > 0

    - name: Validate requested client count
      ansible.builtin.assert:
        that:
          - requested_client_count | int >= 1
          - requested_client_count | int <= eligible_fl_clients | default([]) | length
        fail_msg: >-
          Pass -e fl_client_count=N, where N is between 1 and
          {{ eligible_fl_clients | default([]) | length }} for the current inventory.
          Dataset-backed clients: {{ eligible_fl_clients | default([]) | join(', ') }}.

    - name: Add selected clients to temporary experiment group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: fl_selected_clients
      loop: "{{ (eligible_fl_clients | default([]))[0:(requested_client_count | int)] }}"

    - name: Show experiment client selection
      ansible.builtin.debug:
        msg: >-
          Starting {{ requested_client_count }} client(s):
          {{ (eligible_fl_clients | default([]))[0:(requested_client_count | int)] | join(', ') }}

- name: Stop stale FL clients before experiment
  hosts: fl_clients
  gather_facts: false
  become: true
  tasks:
    - name: Discover services
      ansible.builtin.service_facts:

    - name: Stop existing FL client service if present
      ansible.builtin.systemd:
        name: fl-thesis-client.service
        state: stopped
      when: "'fl-thesis-client.service' in ansible_facts.services"

- name: Start federated server on main
  hosts: main
  gather_facts: true
  vars:
    fl_run_user: "{{ ansible_user_id }}"
  tasks:
    - name: Resolve server address clients should use
      ansible.builtin.set_fact:
        fl_server_address_effective: >-
          {{ fl_server_host if (fl_server_host | length > 0) else ansible_default_ipv4.address }}

    - name: Verify server deployment environment exists
      ansible.builtin.stat:
        path: "{{ venv_dir }}/bin/python"
      register: server_python

    - name: Require provisioned server environment
      ansible.builtin.assert:
        that:
          - server_python.stat.exists
        fail_msg: >-
          Deployment venv is missing on main. Run 01-provision-repo.yml first.

    - name: Install systemd unit for FL server
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/fl-thesis-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=Master thesis federated-learning server
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ fl_run_user }}
          WorkingDirectory={{ deployment_dir }}
          Environment=PYTHONUNBUFFERED=1
          ExecStart={{ venv_dir }}/bin/python {{ deployment_dir }}/server/server.py --host 0.0.0.0 --port {{ fl_port }} --model {{ fl_model_path }} --rounds {{ fl_rounds }} --local-epochs {{ fl_local_epochs }} --batch-size {{ fl_batch_size }} --join-window {{ fl_join_window }} --round-timeout {{ fl_round_timeout }}
          Restart=no

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd on server

    - name: Flush server systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Restart FL server for a clean experiment
      become: true
      ansible.builtin.systemd:
        name: fl-thesis-server.service
        state: restarted
        enabled: false

    - name: Show server endpoint
      ansible.builtin.debug:
        msg: "FL server listening for clients at {{ fl_server_address_effective }}:{{ fl_port }}"

  handlers:
    - name: Reload systemd on server
      become: true
      ansible.builtin.systemd:
        daemon_reload: true

- name: Start selected FL clients
  hosts: fl_selected_clients
  gather_facts: true
  vars:
    fl_run_user: "{{ ansible_user_id }}"
    fl_client_id_effective: "{{ inventory_hostname }}"
    fl_client_data_path: "{{ repo_dest }}/tools2/data/fl_dataset/{{ fl_dataset_name }}"
  tasks:
    - name: Require a dataset assignment for selected client
      ansible.builtin.assert:
        that:
          - fl_dataset_name is defined
          - fl_dataset_name | length > 0
        fail_msg: >-
          {{ inventory_hostname }} has no fl_dataset_name in inventory.yml.

    - name: Verify client deployment environment exists
      ansible.builtin.stat:
        path: "{{ venv_dir }}/bin/python"
      register: client_python

    - name: Require provisioned client environment
      ansible.builtin.assert:
        that:
          - client_python.stat.exists
        fail_msg: >-
          Deployment venv is missing on {{ inventory_hostname }}.
          Run 01-provision-repo.yml first.

    - name: Verify local FL dataset exists
      ansible.builtin.stat:
        path: "{{ fl_client_data_path }}/train.csv"
      register: client_dataset

    - name: Require local dataset
      ansible.builtin.assert:
        that:
          - client_dataset.stat.exists
        fail_msg: "Missing dataset: {{ fl_client_data_path }}"

    - name: Check server port from the client machine
      ansible.builtin.wait_for:
        host: "{{ hostvars['main']['fl_server_address_effective'] }}"
        port: "{{ fl_port }}"
        connect_timeout: 3
        timeout: 60
        state: started

    - name: Install systemd unit for FL client
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/fl-thesis-client.service
        mode: "0644"
        content: |
          [Unit]
          Description=Master thesis federated-learning client ({{ fl_client_id_effective }})
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User={{ fl_run_user }}
          WorkingDirectory={{ deployment_dir }}
          Environment=PYTHONUNBUFFERED=1
          ExecStart={{ venv_dir }}/bin/python {{ deployment_dir }}/client/client.py --server {{ hostvars['main']['fl_server_address_effective'] }} --port {{ fl_port }} --client-id {{ fl_client_id_effective }} --data {{ fl_client_data_path }}
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd on client

    - name: Flush client systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Start selected FL client
      become: true
      ansible.builtin.systemd:
        name: fl-thesis-client.service
        state: restarted
        enabled: false

    - name: Experiment started on client
      ansible.builtin.debug:
        msg: >-
          Started {{ fl_client_id_effective }} using {{ fl_dataset_name }}
          against {{ hostvars['main']['fl_server_address_effective'] }}:{{ fl_port }}.

  handlers:
    - name: Reload systemd on client
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
